name: scrape-volley

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # haftada bir PAZARTESI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests blackboxprotobuf
      - name: Probe endpoints
        run: python probe_future.py || true
      - name: Run scraper
        run: python scrape.py
        timeout-minutes: 12
      - name: Upload DB
        uses: actions/upload-artifact@v4
        with:
          name: aiscore_full_db
          path: aiscore_full.db
          retention-days: 30
      - name: Commit back
        run: |
          git config user.name "manyjo-bot"
          git config user.email "manyjo123@users.noreply.github.com"
          git add -f aiscore_full.db
          git diff --cached --quiet && echo "no changes" || git commit -m "data $(date -u +%Y%m%d_%H%M)"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main || echo "push failed"
        continue-on-error: true